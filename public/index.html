<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otari Tester</title>
    <link rel="icon" href="https://render.com/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">Otari Tester</a>
        <nav class="top-actions">
          <a
            id="otari-template-btn"
            class="btn btn-ghost"
            href="https://render.com/deploy-template/api/github/start?template_repo=otari-render-template"
            target="_blank"
            rel="noopener"
            >Deploy Otari</a
          >
          <a
            id="deploy-btn"
            class="btn btn-deploy"
            href="https://render.com/deploy?repo=https://github.com/ojusave/otari-tester"
            target="_blank"
            rel="noopener"
            title="Deploy this tester"
          >
            <img
              src="https://render.com/images/deploy-to-render-button.svg"
              alt="Deploy to Render"
              height="28"
            />
          </a>
          <a
            id="signup-btn"
            class="btn btn-ghost"
            href="#"
            target="_blank"
            rel="noopener"
            >Sign up on Render</a
          >
        </nav>
      </header>

      <div class="workspace">
        <aside class="rail">
          <p class="rail-title">Connection</p>
          <label>
            Otari URL
            <input
              id="base-url"
              type="url"
              required
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label>
            API key
            <input
              id="api-key"
              type="password"
              autocomplete="off"
              placeholder="gw-…"
              required
            />
          </label>
          <label>
            Model
            <select id="model" required></select>
          </label>
          <label class="custom-model" id="custom-model-wrap" hidden>
            Custom id
            <input
              id="custom-model"
              type="text"
              placeholder="provider:model"
              spellcheck="false"
            />
          </label>
          <p id="model-status" class="model-status">loading…</p>

          <div class="rail-status">
            <div class="status-pill" id="pill-health">
              <span class="dot"></span>
              <span class="pill-label">health</span>
              <span class="pill-value" id="health-value">—</span>
            </div>
            <div class="status-pill" id="pill-readiness">
              <span class="dot"></span>
              <span class="pill-label">ready</span>
              <span class="pill-value" id="readiness-value">—</span>
            </div>
          </div>

          <div class="rail-footer">
            <a id="github-link" href="https://github.com/ojusave/otari-tester"
              >GitHub</a
            >
            <span class="sep">·</span>
            <a
              id="otari-template-repo"
              href="https://github.com/render-examples/otari-render-template"
              target="_blank"
              rel="noopener"
              >Template</a
            >
          </div>
        </aside>

        <section class="chat">
          <div id="thread" class="thread">
            <div class="empty" id="empty-state">
              <h1>Talk to your Otari gateway</h1>
              <p>
                Set URL and a <code>gw-…</code> key in the rail, pick a model,
                then send a prompt. Replies show here.
              </p>
            </div>
          </div>

          <form id="chat-form" class="composer">
            <textarea
              id="prompt"
              rows="3"
              required
              placeholder="Message Otari…"
            ></textarea>
            <div class="composer-bar">
              <span class="composer-hint">Enter to send · Shift+Enter for newline</span>
              <button type="submit" id="send-btn">Send</button>
            </div>
          </form>
        </section>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
